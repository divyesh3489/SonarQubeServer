# Fixed project name so volumes/containers never mix with the existing 'hexagare' stack.
name: sonarqube

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    # Not published on the host; only reachable through the nginx container below.
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    networks:
      - sonarnet

  nginx:
    image: nginx:alpine
    container_name: sonarqube-nginx
    restart: unless-stopped
    depends_on:
      - sonarqube
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
    # Reached at https://<EC2_PUBLIC_IP>:<SONAR_PORT>. Requests using any other
    # Host (such as the existing project's domain) are rejected.
    ports:
      - "${SONAR_PORT}:443"
    volumes:
      - ./nginx/sonarqube.conf.template:/etc/nginx/templates/default.conf.template:ro
      # SonarQube-only certbot dir (see certbot.env); whole dir because live/ symlinks into archive/.
      - /etc/letsencrypt-sonarqube:/etc/letsencrypt:ro
    networks:
      - sonarnet

  db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No ports published: the database is only reachable from the sonarqube container.
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sonarnet

# Separate network so these containers stay isolated from the existing project's containers.
networks:
  sonarnet:
    name: sonarnet

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
