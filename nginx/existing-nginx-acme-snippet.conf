# Install as /etc/nginx/conf.d/sonarqube-acme.conf on the host (next to hexagare.conf), replacing <EC2_PUBLIC_IP>.
# It only matches requests to the bare IP, so the hexagare.rexiops.dev server blocks are not affected.
# Let's Encrypt validates the IP certificate over http://<EC2_PUBLIC_IP>/.well-known/acme-challenge/.

server {
    listen 80;
    server_name <EC2_PUBLIC_IP>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
