# Add this server block to your EXISTING project's Nginx (the one on port 80), replacing <EC2_PUBLIC_IP>.
# It only matches requests to the bare IP, so your domain's server blocks are not affected.
# Let's Encrypt validates the IP certificate over http://<EC2_PUBLIC_IP>/.well-known/acme-challenge/.
# If your existing Nginx runs in Docker, also mount /var/www/certbot into that container.

server {
    listen 80;
    server_name <EC2_PUBLIC_IP>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
